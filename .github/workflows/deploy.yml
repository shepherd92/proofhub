name: Deploy website to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ['main']

# The reusable build has read-only access. Deployment permissions are granted
# narrowly to the main-only deploy job below.
permissions:
  contents: read
  pages: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build website using the reusable, fully validated workflow.
  build:
    if: github.repository_owner != 'HugoBlox'
    uses: ./.github/workflows/build.yml

  # This repository intentionally has one deployment target: GitHub Pages.
  deploy:
    needs: build
    # Defense in depth: previews and non-main revisions must never publish Pages.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
