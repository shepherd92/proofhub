name: Build

env:
  NODE_VERSION: '22'

on:
  # Standalone trigger for PR validation
  pull_request:
    branches: ['main']
  # Reusable workflow trigger - called by deploy.yml
  workflow_call:
    outputs:
      artifact-id:
        description: 'The ID of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-id }}
  # Allow manual trigger for testing
  workflow_dispatch:

# Read-only permissions for security
permissions:
  contents: read
  pages: read

# Prevent duplicate builds for the same PR
concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Fetch history for Hugo's .GitInfo and .Lastmod
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip

    - name: Install project tooling
      run: python -m pip install -r requirements.txt

    - name: Test project tooling
      run: python -m unittest discover -s tests -v

    - name: Build project catalogue and AI prompts
      env:
        # Production builds can resolve a Git commit author to a GitHub account.
        # Pull-request code receives no token; local Git attribution still works.
        PROOF_RELAY_GITHUB_REPOSITORY: ${{ github.repository }}
        PROOF_RELAY_GITHUB_API_URL: ${{ github.api_url }}
        PROOF_RELAY_GITHUB_TOKEN: ${{ github.event_name != 'pull_request' && github.token || '' }}
      run: python scripts/build_projects.py --generate

    - name: Setup pnpm
      if: hashFiles('package.json') != ''
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Get Hugo Version
      id: hugo-version
      run: |
        VERSION=$(python -c 'import pathlib,yaml; data=yaml.safe_load(pathlib.Path("hugoblox.yaml").read_text()) or {}; print(data.get("build", {}).get("hugo_version", ""))')

        # Fallback to a known stable version if not specified
        DEFAULT_VERSION="0.161.1"
        VERSION=${VERSION:-$DEFAULT_VERSION}

        # Validate version format (basic check)
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::warning::Invalid hugo_version format '$VERSION', using default $DEFAULT_VERSION"
          VERSION="$DEFAULT_VERSION"
        fi

        echo "HUGO_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Using Hugo version: $VERSION"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Verify Tailwind CSS dependency
      if: hashFiles('package.json') != ''
      run: |
        if ! node -e "require.resolve('@tailwindcss/cli/package.json')" 2>/dev/null; then
          echo "::error title=Missing dependency '@tailwindcss/cli'::Hugo >= 0.161.0 requires the npm @tailwindcss/cli package. Add it to package.json:"
          echo "::error::  pnpm add @tailwindcss/cli tailwindcss"
          echo "::error::See https://github.com/HugoBlox/kit for upgrade instructions."
          exit 1
        fi

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true

    # Cache Hugo module downloads. Node dependencies are always reconstructed
    # from the frozen pnpm lockfile above.
    - uses: actions/cache@v5
      with:
        path: /tmp/hugo_cache_runner/
        key: ${{ runner.os }}-hugo-modules-${{ hashFiles('**/go.mod', '**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-hugo-modules-

    # Cache Hugo resources (processed images, CSS) - invalidates only when assets/config change
    - uses: actions/cache@v5
      with:
        path: resources/
        key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**/*', 'config/**/*', 'layouts/**/*',
          'hugoblox.yaml', 'go.mod', 'go.sum', 'package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-hugo-resources-

    - name: Setup Pages
      id: pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@v5

    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
        HUGO_BLOX_LICENSE: ${{ github.event_name != 'pull_request' && secrets.HUGO_BLOX_LICENSE || '' }}
      run: |
        echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
        SITE_BASE_URL="${{ steps.pages.outputs.base_url }}"
        if [ -z "$SITE_BASE_URL" ]; then
          SITE_BASE_URL="https://example.invalid/${GITHUB_REPOSITORY#*/}/"
        fi
        SITE_BASE_URL="${SITE_BASE_URL%/}/"
        echo "SITE_BASE_URL=$SITE_BASE_URL" >> "$GITHUB_ENV"
        hugo --minify --cleanDestinationDir --baseURL "$SITE_BASE_URL"

    - name: Check that raw exports were not published
      run: |
        PUBLISHED_RAW=$(find public -type f -ipath '*/raw/*' -print -quit)
        if [ -n "$PUBLISHED_RAW" ]; then
          echo "::error::Raw project export was published: $PUBLISHED_RAW"
          exit 1
        fi

    - name: Generate Pagefind search index
      run: pnpm run pagefind

    - name: Check internal links and repository-subpath routing
      run: python scripts/check_site.py --site public --base-url "$SITE_BASE_URL"

    - name: Upload artifact
      id: upload
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public
